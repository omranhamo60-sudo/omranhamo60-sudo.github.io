<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بيانات العيادة</title>
</head>

<body>

    <h1>بيانات العيادة</h1>

    <p>من فضلك أدخل بيانات العيادة</p>

    <form>

        <!-- اسم العيادة -->
        <label>اسم العيادة:</label>
        <br>
        <input 
            type="text" 
            placeholder="مثال: عيادة الشفاء"
        >

        <br><br>

        <!-- اسم الدكتور -->
        <label>اسم الدكتور:</label>
        <br>
        <input 
            type="text" 
            placeholder="مثال: د. محمد أحمد"
        >

        <br><br>

        <!-- التخصص -->
        <label>التخصص:</label>
        <br>

        <select>
            <option>اختر التخصص</option>
            <option>أسنان</option>
            <option>باطنة</option>
            <option>أطفال</option>
            <option>جلدية</option>
            <option>عظام</option>
            <option>عيون</option>
            <option>نساء وتوليد</option>
        </select>

        <br><br>

        <!-- رقم الهاتف -->
        <label>رقم الهاتف:</label>
        <br>
        <input 
            type="tel" 
            placeholder="01XXXXXXXXX"
        >

        <br><br>

        <!-- البريد الإلكتروني -->
        <label>البريد الإلكتروني:</label>
        <br>
        <input 
            type="email" 
            placeholder="example@gmail.com"
        >

        <br><br>

        <!-- العنوان -->
        <label>عنوان العيادة:</label>
        <br>
        <input 
            type="text" 
            placeholder="اكتب عنوان العيادة"
        >

        <br><br>

        <!-- مواعيد العمل -->
        <label>مواعيد العمل:</label>
        <br>
        <input 
            type="text" 
            placeholder="مثال: من 5 مساءً إلى 10 مساءً"
        >

        <br><br>

        <!-- الخدمات -->
        <label>الخدمات التي تقدمها العيادة:</label>
        <br>

        <textarea 
            rows="5" 
            cols="40"
            placeholder="اكتب خدمات العيادة هنا..."
        ></textarea>

        <br><br>

        <!-- وصف العيادة -->
        <label>نبذة عن العيادة:</label>
        <br>

        <textarea 
            rows="6" 
            cols="40"
            placeholder="اكتب نبذة بسيطة عن العيادة..."
        ></textarea>

        <br><br>

        <button type="submit">
            إرسال البيانات
        </button>

        <button type="reset">
            مسح البيانات
        </button>

    </form>

</body>

</html>
